<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#26364a">
    <title>Offline | MediCare+</title>
    <style>
      :root {
        color: #26364a;
        background: #f5fbf8;
        font: 16px/1.6 "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: linear-gradient(125deg, #f5fbf8, #f7f5ff 56%, #f2f8ff);
      }

      main {
        width: min(440px, 100%);
        padding: 36px;
        border: 1px solid #fff;
        border-radius: 20px;
        background: rgb(255 255 255 / 90%);
        box-shadow: 0 16px 48px rgb(48 63 90 / 10%);
        text-align: center;
        box-sizing: border-box;
      }

      .brand {
        color: #26364a;
        font-size: 23px;
        font-weight: 750;
      }

      .brand span {
        color: #438d75;
      }

      .symbol {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 28px auto 16px;
        place-items: center;
        border-radius: 16px;
        background: #e4f6ed;
        color: #34745f;
        font-size: 28px;
      }

      h1 {
        margin: 0;
        font-size: 23px;
      }

      p {
        margin: 12px 0 22px;
        color: #718096;
        font-size: 14px;
      }

      button {
        min-height: 42px;
        padding: 0 18px;
        border: 0;
        border-radius: 11px;
        background: #438d75;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: #34745f;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">MediCare<span>+</span></div>
      <div class="symbol" aria-hidden="true">+</div>
      <h1>You’re offline</h1>
      <p>
        Previously visited application pages may be available, but sign-in,
        patient records, and changes need a connection. Nothing is saved while
        offline.
      </p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => location.reload())
    </script>
  </body>
</html>
